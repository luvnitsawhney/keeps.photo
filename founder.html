<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film brief · Keeps</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#e6efff">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<link rel="stylesheet" href="assets/app.css?v=20261203">
<style>
  .page.brief { max-width: 48rem; }
  .due { display: flex; gap: .75rem; align-items: center; }
  .kv2 { display: grid; grid-template-columns: minmax(7rem, auto) 1fr; gap: .625rem 1rem; font: var(--t-body); }
  .kv2 dt { color: var(--content-secondary); }
  .kv2 dd { font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ref { display: grid; grid-template-columns: 7rem 1fr; gap: 1rem; align-items: center; }
  .ref img { width: 7rem; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--r-m); }
  .person h3 { font: var(--t-body-bold); margin-bottom: .25rem; }
  .person ul { display: grid; gap: .25rem; }
  .person a { display: flex; justify-content: space-between; gap: 1rem; padding: .625rem .75rem; border-radius: var(--r-s); background: var(--bg-neutral); font: var(--t-body); color: var(--content-primary); text-decoration: none; }
  .person a:hover { background: var(--bg-neutral-hover); }
  .person a span:last-child { color: var(--content-secondary); flex: none; }
  .people { display: grid; gap: 1rem; }
  .total { display: grid; gap: .5rem; }
  .total .row { display: flex; justify-content: space-between; font: var(--t-body-bold); }
  .total .bar { height: 8px; border-radius: var(--r-full); background: var(--bg-neutral); overflow: hidden; }
  .total .bar i { display: block; height: 100%; background: var(--interactive-accent); transform: scaleX(0); transform-origin: left; transition: transform .2s; }
  .field input[type=file] { height: auto; padding: .5rem; border: 1px dashed var(--border-input); border-radius: var(--r-m); background: var(--bg-neutral); font: var(--t-body); color: var(--content-secondary); width: 100%; }
  .field input[type=file]::file-selector-button { margin-right: .75rem; height: 2.5rem; padding: 0 1rem; border: 0; border-radius: var(--r-full); background: var(--interactive-secondary); color: var(--interactive-on-secondary); font: var(--t-body-bold); cursor: pointer; }
  .help code { font-size: .8125rem; overflow-wrap: anywhere; }
  .replace summary { cursor: pointer; font: var(--t-body-bold); color: var(--content-link); padding: .25rem 0; }
  .replace .stack { display: grid; gap: 1rem; margin-top: .75rem; }
  code.cmd { display: block; padding: .75rem 1rem; border-radius: var(--r-m); background: var(--bg-neutral); font: 500 .875rem/1.4 ui-monospace, Menlo, monospace; overflow-x: auto; white-space: nowrap; }
</style>
</head>
<body>
<header class="appbar"><a class="logo" href="/" aria-label="Keeps home"><svg viewBox="0 222 368 92" aria-hidden="true"><use href="assets/brand/keeps-logo.svg#logo"/></svg></a>
  <div class="end"><span class="badge">Founder</span></div></header>
<main class="page brief" id="app"><div class="sk-wrap" aria-busy="true" aria-label="Loading the brief"><span class="sk sk-line w50 tall"></span><span class="sk sk-line w30"></span><div class="card sk-card"><span class="sk sk-btn"></span><span class="sk sk-btn"></span></div><div class="card sk-card"><div class="sk-row"><span class="sk sk-av s"></span><span class="sk-col"><span class="sk sk-line w50"></span><span class="sk sk-line w30"></span></span></div><div class="sk-row"><span class="sk sk-av s"></span><span class="sk-col"><span class="sk sk-line w50"></span><span class="sk sk-line w30"></span></span></div><div class="sk-row"><span class="sk sk-av s"></span><span class="sk-col"><span class="sk sk-line w50"></span><span class="sk sk-line w30"></span></span></div><div class="sk-row"><span class="sk sk-av s"></span><span class="sk-col"><span class="sk sk-line w50"></span><span class="sk sk-line w30"></span></span></div></div></div></main>
<script src="assets/config.js?v=20261203"></script><script src="assets/common.js?v=20261203"></script><script src="assets/ui.js?v=20261203"></script>
<script>
// The founder's design brief for one order: everything needed to cut the film, plus every file to download.
// Opened from the alert email (signed link). "Brief for AI" is a Markdown file to hand to the editing agent with the media.
(function () {
  const qs = new URLSearchParams(location.search), app = K.$("#app"), I = K.icon;
  const ist = (d) => d ? new Date(d).toLocaleString("en-IN", { timeZone: "Asia/Kolkata", weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) + " IST" : "";
  const day = (d) => d ? K.fmtDate(String(d).slice(0, 10), { weekday: "short", day: "numeric", month: "short", year: "numeric" }) : "";
  const isVid = (f) => /^video\//.test(f.mime || "") || /\.(mov|mp4|m4v|3gp|avi|mkv|webm|mts|m2ts|hevc)$/i.test(f.filename);

  function md(b) {
    const by = group(b.files);
    const L = [
      `# Film brief: ${b.honoree || "Untitled"}${b.occasion ? " · " + b.occasion : ""}`, "",
      "## Delivery",
      `- Deliver by: ${ist(b.due_at) || "when uploads close + 1 hour"}`,
      `- Shape: ${b.orientation === "portrait" ? "Portrait 9:16 (1080×1920)" : "Landscape 16:9 (1920×1080)"}`,
      `- Celebration day: ${day(b.event_date) || "not given"}`, "",
      "## Creative",
      `- Feeling: ${b.tone || "Warm"}`,
      `- Style: ${b.theme || "Surprise me"}${b.style_ref ? ` (reference frame: ${b.style_ref})` : ""}`,
      `- Opening title: ${b.title_text || "(write one that fits the occasion)"}`,
      `- Closing line: ${b.end_text || "(write one, signed from everyone)"}`, "",
      "## About them", b.brief || "(not given)", "",
      "## Must include", b.must_include || "(nothing specific)", "",
      "## Organiser's note to guests", b.family_message || "(none)", "",
      "## Media", `${b.files.length} files from ${Object.keys(by).length} people. Honoree photo: ${b.cover ? "honoree-photo.jpg" : "none"}.`, "",
      ...Object.entries(by).flatMap(([who, fs]) => [`### ${who}`, ...fs.map((f) => `- ${f.filename} (${isVid(f) ? "video" : "photo"}, ${K.size(f.size_bytes)}${f.late ? ", arrived after close" : ""})`), ""]),
      "## Notes for the edit",
      "- Video wishes are the heart of the film: keep each person's message intact; trim only dead air.",
      "- Use the honoree photo for the opening and closing frames.",
      "- Photos without a video: use them as a montage between messages, grouped by person.",
      b.remake_note ? `- REMAKE requested: ${b.remake_note}` : "",
      "", `Organiser: ${b.organiser || ""} · ${b.email || ""} · ${b.phone || ""}`, `Order: ${b.id}`,
    ];
    return L.filter((x, i) => x !== "" || L[i - 1] !== "").join("\n");
  }
  function group(files) {   // one person per name, ignoring case and stray spaces
    const by = {}, seen = {};
    files.forEach((f) => { const raw = String(f.contributor || "Someone").trim(); (by[seen[raw.toLowerCase()] ||= raw] ||= []).push(f); });
    return by;
  }

  // ---------- deliver the finished film ----------
  const remakeDue = (b) => !!(b.delivered_at && b.remake_requested_at && !b.remake_delivered_at);
  function deliverHTML(b) {
    const done = b.delivered_at && !remakeDue(b);
    const form = `<div class="field"><label for="dl-master">Finished film</label>
        <input type="file" id="dl-master" accept="video/mp4,video/quicktime,video/*">
        <p class="help">The full-quality MP4 they'll download and keep.</p></div>
      <div class="field"><label for="dl-share">Smaller copy for WhatsApp <span class="optional">· Optional</span></label>
        <input type="file" id="dl-share" accept="video/mp4,video/*">
        <p class="help">Make both with <code>python3 scripts/keeps.py export film.mp4</code>. Skip it and we use the finished film for both.</p></div>
      <div class="total" id="dl-prog" hidden><div class="row"><span id="dl-l">Uploading</span><span id="dl-p">0%</span></div><div class="bar"><i id="dl-bar"></i></div></div>
      <p class="msg-err" id="dl-err" role="alert"></p>
      <button class="btn block" type="button" id="dl-go">${remakeDue(b) ? "Upload and deliver the remake" : "Upload and deliver"}</button>`;
    if (done) return `<section class="card" id="deliver"><div class="alert positive">${I("check")}<span>Delivered ${K.esc(ist(b.delivered_at))}. ${K.esc(b.organiser || "They")} got the "film is ready" email.</span></div>
      <details class="replace"><summary>Replace the film</summary><div class="stack">${form}<p class="t-body">Replacing doesn't send another email.</p></div></details></section>`;
    return `<section class="card" id="deliver"><div class="stack-s"><h2 class="t-body-title">${remakeDue(b) ? "Deliver the remake" : "Deliver the film"}</h2>
      <p class="t-body">${remakeDue(b) ? `They asked: “${K.esc(b.remake_note || "")}”. ` : ""}Upload the finished film. We put it on their order page and email ${K.esc(b.buyer_email || "them")} that it's ready.</p></div>${form}</section>`;
  }
  let tusP = null;
  const loadTus = () => tusP ||= new Promise((ok, no) => { const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tus-js-client@4.1.0/dist/tus.min.js"; s.onload = ok; s.onerror = () => { tusP = null; no(new Error("Couldn't load the uploader. Check your connection.")); }; document.head.append(s); });
  async function putFile(b, file, kind, onPct) {
    await loadTus();
    const sig = await K.api("/admin/deliver/sign", { order_id: b.id, k: qs.get("k"), kind });
    await new Promise((resolve, reject) => {
      const headers = { "x-signature": sig.token, "x-upsert": "false" };
      if (K.cfg.publishableKey) headers.apikey = K.cfg.publishableKey;
      const up = new tus.Upload(file, { endpoint: K.cfg.tus, headers, uploadDataDuringCreation: true, removeFingerprintOnSuccess: true,
        chunkSize: 6 * 1024 * 1024, retryDelays: [0, 2000, 5000, 10000, 20000, 30000],
        metadata: { bucketName: sig.bucket, objectName: sig.path, contentType: file.type || "video/mp4", cacheControl: "3600" },
        onProgress: (a, t) => onPct(a / t), onError: reject, onSuccess: resolve });
      up.start();
    });
    return sig.path;
  }
  // Thumbnail: a frame about 10 seconds in (a fifth of the way for short films), as a JPEG. Null if the browser can't decode it.
  function grabFrame(file) {
    return new Promise((resolve) => {
      const v = document.createElement("video"), url = URL.createObjectURL(file);
      const done = (blob) => { URL.revokeObjectURL(url); resolve(blob); };
      v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
      setTimeout(() => done(null), 20000);
      v.onerror = () => done(null);
      v.onloadedmetadata = () => { v.currentTime = Math.min(10, (v.duration || 10) * 0.2); };
      v.onseeked = () => {
        const w = Math.min(1280, v.videoWidth), h = Math.round(w * v.videoHeight / v.videoWidth);
        if (!w || !h) return done(null);
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(v, 0, 0, w, h);
        c.toBlob((bl) => done(bl), "image/jpeg", 0.85);
      };
    });
  }
  async function putPoster(b, blob) {
    const sig = await K.api("/admin/deliver/sign", { order_id: b.id, k: qs.get("k"), kind: "poster" });
    const r = await fetch(sig.signed_url, { method: "PUT", headers: { "content-type": "image/jpeg" }, body: blob });
    return r.ok ? sig.path : null;
  }
  function wireDeliver(b) {
    const go = K.$("#dl-go"); if (!go) return;
    go.addEventListener("click", () => {
      const master = K.$("#dl-master").files[0], share = K.$("#dl-share").files[0];
      K.$("#dl-err").textContent = master ? "" : "Choose the finished film first.";
      if (!master) return;
      // Delivering emails the customer: confirm first.
      const sh = K.sheet({ id: "dl-confirm", title: remakeDue(b) ? "Deliver the remake?" : `Deliver ${K.esc(b.honoree || "the")}'s film?`,
        sub: `We'll upload ${K.esc(master.name)} (${K.size(master.size)})${share ? " and the smaller copy" : ""}, put it on their order page and email ${K.esc(b.buyer_email || "them")}. You can't unsend the email.`,
        foot: `<button class="btn block" type="button" id="dl-yes">Upload and deliver</button><button class="btn neutral block" type="button" data-close>Not yet</button>` });
      K.$("#dl-yes").addEventListener("click", async () => {
        sh.close(); go.disabled = true; K.$("#dl-prog").hidden = false;
        const total = master.size + (share?.size || 0);
        const pct = (base, size) => (f) => { const p = Math.floor(((base + f * size) / total) * 100); K.$("#dl-p").textContent = p + "%"; K.$("#dl-bar").style.transform = `scaleX(${p / 100})`; };
        try {
          K.$("#dl-l").textContent = "Uploading the finished film";
          const master_path = await putFile(b, master, "master", pct(0, master.size));
          let share_path = null;
          if (share) { K.$("#dl-l").textContent = "Uploading the smaller copy"; share_path = await putFile(b, share, "share", pct(master.size, share.size)); }
          K.$("#dl-l").textContent = "Making the thumbnail…";
          const frame = await grabFrame(share || master).catch(() => null);
          const poster_path = frame ? await putPoster(b, frame).catch(() => null) : null;
          K.$("#dl-l").textContent = "Delivering…";
          const r = await K.api("/admin/deliver/done", { order_id: b.id, k: qs.get("k"), master_path, share_path: share_path || master_path, poster_path });
          K.$("#deliver").innerHTML = `<div class="alert positive">${I("check")}<span><b>Delivered.</b> ${r.email === "sent" ? `We emailed ${K.esc(r.buyer_email)} that ${r.remake ? "the remake" : "their film"} is ready.`
              : r.email === "earlier" ? "The film is replaced. They already had the ready email, so we didn't send another."
              : "The ready email didn't go out yet. It retries every minute."}</span></div>
            <a class="btn secondary md" href="${K.esc(r.owner_url)}" target="_blank" rel="noopener" style="justify-self:start">See their order page</a>`;
        } catch (x) { K.$("#dl-err").textContent = x.message || "The upload stopped. Try again."; go.disabled = false; }
      });
    });
  }

  function render(b) {
    const by = group(b.files), people = Object.keys(by).length;
    const kv = (rows) => `<dl class="kv2">${rows.filter(([, v]) => v).map(([k, v]) => `<dt>${K.esc(k)}</dt><dd>${K.esc(v)}</dd>`).join("")}</dl>`;
    document.title = `${b.honoree || "Film"} brief · Keeps`;
    app.innerHTML = `
      <div class="page-head"><h1 class="t-screen">${K.esc(b.honoree || "Untitled")}${b.occasion ? ` · ${K.esc(b.occasion)}` : ""}</h1>
        <p class="t-lead">${b.files.length} files from ${people} ${people === 1 ? "person" : "people"}.</p></div>
      ${b.due_at && !b.delivered_at ? `<div class="alert warning due">${I("clock")}<span><b>Deliver by ${K.esc(ist(b.due_at))}</b></span></div>` : ""}
      ${b.delivered_at ? `<div class="alert positive">${I("check")}<span>Delivered ${K.esc(ist(b.delivered_at))}</span></div>` : ""}
      <section class="card"><div class="btn-stack">
        <button class="btn block" type="button" id="all">${I("download")}<span>Download everything (.zip, ${K.size(b.files.reduce((a, f) => a + Number(f.size_bytes || 0), 0))})</span></button>
        <button class="btn secondary block" type="button" id="md">${I("edit")}Download brief for AI (.md)</button></div>
        <p class="t-body" id="zip-st">One zip: a folder per person, the honoree photo and the brief. Or pull everything to your Mac:</p>
        <code class="cmd">python3 scripts/keeps.py pull ${K.esc(b.id)}</code></section>
      ${deliverHTML(b)}
      <section class="card"><h2 class="t-body-title">Delivery</h2>${kv([
        ["Deliver by", ist(b.due_at)], ["Shape", b.orientation === "portrait" ? "Portrait 9:16" : "Landscape 16:9"],
        ["Celebration", day(b.event_date)], ["Uploads closed", b.closed_at ? `${ist(b.closed_at)} (${b.close_reason === "buyer" ? "organiser closed early" : "deadline"})` : `Open until ${ist(b.cutoff_at)}`]])}</section>
      <section class="card"><h2 class="t-body-title">Creative</h2>
        ${b.style_ref ? `<div class="ref"><img src="${K.esc(b.style_ref)}" alt=""><div><b>${K.esc(b.theme)}</b><p class="t-body">${K.esc(b.tone || "Warm")}</p></div></div>` : ""}
        ${kv([["Style", b.style_ref ? "" : b.theme || "Surprise me"], ["Feeling", b.style_ref ? "" : b.tone || "Warm"],
          ["Opening title", b.title_text || "Not given: write one"], ["Closing line", b.end_text || "Not given: write one"],
          ["About them", b.brief], ["Must include", b.must_include], ["Note to guests", b.family_message], ["Remake request", b.remake_note]])}</section>
      <section class="card"><h2 class="t-body-title">Media</h2><div class="people">
        ${b.cover ? `<div class="person"><h3>Honoree photo</h3><ul><li><a href="${K.esc(b.cover)}">${I("photo", "s")}<span>honoree-photo.jpg</span><span></span></a></li></ul></div>` : ""}
        ${Object.entries(by).map(([who, fs]) => `<div class="person"><h3>${K.esc(who)}</h3><ul>${fs.map((f) =>
          `<li><a href="${K.esc(f.url)}" download><span>${K.esc(f.filename)}${f.late ? " · late" : ""}</span><span>${isVid(f) ? "Video" : "Photo"} · ${K.size(f.size_bytes)}</span></a></li>`).join("")}</ul></div>`).join("")}
      </div></section>
      <section class="card">${kv([["Organiser", b.organiser], ["Email", b.email], ["Phone", b.phone], ["Order", b.id]])}
        <a class="btn neutral md" href="${K.esc(b.owner_url)}" style="justify-self:start">Open their order page</a></section>`;
    wireDeliver(b);
    K.$("#md").addEventListener("click", () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([md(b)], { type: "text/markdown" }));
      a.download = `brief-${(b.honoree || "film").toLowerCase().replace(/[^a-z0-9]+/g, "-")}.md`; a.click();
    });
    // Everything as one zip. Chrome/Edge stream it straight to disk (any size); Safari builds it in memory.
    K.$("#all").addEventListener("click", async (e) => {
      const btn = e.currentTarget, label = btn.querySelector("span"), st = K.$("#zip-st"), was = label.textContent;
      const slug = (b.honoree || "film").toLowerCase().replace(/[^a-z0-9]+/g, "-");
      const zipName = `keeps-${slug}-${String(b.id).slice(0, 8)}.zip`;
      const safe = (x) => String(x).replace(/[\\/:*?"<>|]+/g, "_").trim() || "file";
      const items = [...(b.cover ? [{ name: "honoree-photo.jpg", url: b.cover }] : []),
        ...Object.entries(group(b.files)).flatMap(([who, fs]) => fs.map((f, i) => ({ name: `${safe(who)}/${String(i + 1).padStart(2, "0")} ${safe(f.filename)}`, url: f.url })))];
      btn.disabled = true;
      try {
        let sink = null;
        if (window.showSaveFilePicker) {
          try { sink = await (await showSaveFilePicker({ suggestedName: zipName, types: [{ description: "Zip", accept: { "application/zip": [".zip"] } }] })).createWritable(); }
          catch (x) { if (x.name === "AbortError") { btn.disabled = false; return; } }
        }
        const { downloadZip } = await import("https://cdn.jsdelivr.net/npm/client-zip@2.4.5/index.js");
        let n = 0;
        async function* entries() {
          yield { name: "brief.md", input: md(b) };
          for (const it of items) {
            label.textContent = `Adding ${++n} of ${items.length}…`;
            const r = await fetch(it.url);
            if (!r.ok) throw new Error(`Couldn't fetch ${it.name}. The link may have expired: reload this page.`);
            yield { name: it.name, input: r };
          }
        }
        const zip = downloadZip(entries());
        if (sink) await zip.body.pipeTo(sink);
        else {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(await zip.blob()); a.download = zipName; a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 60000);
        }
        label.textContent = "Saved"; st.textContent = `Saved ${zipName}.`;
      } catch (x) { st.textContent = x.message || "The zip didn't finish. Try again."; label.textContent = was; }
      btn.disabled = false;
    });
  }

  (async () => {
    try {
      const b = K.demo && !qs.get("id") ? await fetch("dev/brief-demo.json").then((r) => r.json())
        : await K.api(`/admin/brief?id=${encodeURIComponent(qs.get("id") || "")}&k=${encodeURIComponent(qs.get("k") || "")}`);
      render(b);
    } catch (e) { app.innerHTML = `<div class="alert negative">${I("info")}<span>${K.esc(e.message)}</span></div>`; }
  })();
})();
</script>
</body></html>
